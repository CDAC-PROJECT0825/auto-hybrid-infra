<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CDAC Project</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <img
        src="{{ url_for('static', filename='cdac-logo.png') }}"
        alt="CDAC Logo"
      />
      <h1>Welcome to CDAC Project</h1>
      <p>Centre for Development of Advanced Computing</p>
    </header>

    <!-- Main Content -->
    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-header text-center">
          <h3>Project Members</h3>
        </div>
        <div class="card-body">
          <table class="table table-striped table-hover text-center">
            <thead class="table-dark">
              <tr>
                <th>Name</th>
                <th>PRN Number</th>
              </tr>
            </thead>
            <tbody>
              {% for member in members %}
              <tr>
                <td>{{ member.name }}</td>
                <td>{{ member.prn }}</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-5">
      <p>© 2026 CDAC | PG-DAC Project</p>
      <p>Designed & Developed by CDAC Students</p>
    </footer>
  </body>
</html>
